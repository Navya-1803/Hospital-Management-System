spring.application.name=hospital-management-system
server.port=${SERVER_PORT:8080}

# Local MySQL defaults can be overridden through environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hospital_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Provide a Base64-encoded key containing at least 32 random bytes through JWT_SECRET.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

logging.level.com.example.hms=INFO
